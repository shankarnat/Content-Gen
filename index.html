    .panel-title { font-weight: 600; color: #1f2937; font-size: 14px; }
    .panel-tokens { font-size: 12px; color: #6b7280; }

    .prompt-box { font-size: 14px; white-space: pre-wrap; font-family: monospace; background: #f9fafb; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; color: #374151; }

    .mapping-header { font-size: 11px; color: #6b7280; text-transform: uppercase; margin: 8px 0 4px 0; font-weight: 600; }
    .input-fields-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .output-fields-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 8px; }

    /* Template Builder Modal */

    .modal-header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }

    .step-dot.done { background: #22c55e; color: white; }
    .step-dot.pending { background: #e5e7eb; color: #6b7280; }
    .step-line { flex: 1; height: 2px; background: #e5e7eb; align-self: center; }
    .step-line.done { background: #22c55e; }

    .form-label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .form-sublabel { font-size: 12px; color: #6b7280; margin-bottom: 8px; }

    .form-textarea:focus { outline: none; border-color: #9333ea; box-shadow: 0 0 0 3px rgba(147,51,234,0.1); }

    .dmo-card { padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .dmo-card:hover { border-color: #d8b4fe; background: #faf5ff; }
    .dmo-card.selected { border-color: #9333ea; background: #faf5ff; }
    .dmo-card-icon { font-size: 24px; margin-bottom: 4px; }
    .dmo-card-name { font-size: 14px; font-weight: 500; color: #1f2937; }
    .dmo-card-cloud { font-size: 11px; color: #6b7280; }

    .field-checkbox-list { max-height: 250px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; }

    .add-field-btn { padding: 8px 16px; border: 2px dashed #d1d5db; background: white; border-radius: 8px; cursor: pointer; color: #6b7280; font-size: 14px; width: 100%; margin-top: 8px; }
    .add-field-btn:hover { border-color: #9333ea; color: #9333ea; background: #faf5ff; }

    .btn-secondary { background: white; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-next { background: #9333ea; color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; }
    .btn-next:hover { background: #7e22ce; }
    .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }

    .plus-btn { width: 32px; height: 32px; border-radius: 6px; border: 2px dashed #d1d5db; background: white; cursor: pointer; font-size: 18px; color: #6b7280; display: flex; align-items: center; justify-content: center; margin-left: 8px; }
    .plus-btn:hover { border-color: #9333ea; color: #9333ea; background: #faf5ff; }

    .template-type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
    .template-type-badge.custom { background: #fef3c7; color: #92400e; }
    .template-type-badge.builtin { background: #dbeafe; color: #1e40af; }

    .use-case-header { display: flex; align-items: center; justify-content: space-between; }

    /* Safety Rails & PII Indicators */
    .safety-flag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }

    .dmo-select-info { flex: 1; }

    function tokens(t) { return Math.ceil((t || '').length / 4); }

    function resolve(tpl, rec) {
      var t = tpl.prompt;
      var name = tpl.primaryDMO.replace('__dlm', '');
      for (var k in rec) { t = t.split('{{' + name + '.' + k + '}}').join(rec[k] || ''); }
      tpl.relatedDMOs.forEach(function(rd) {
        var rn = rd.replace('__dlm', '');
        var recs = DMOs[rd] ? DMOs[rd].records : [];
        var r = recs.find(function(x) { return x.AccountId === rec.AccountId || x.OpportunityId === rec.OpportunityId; }) || recs[0];
        if (r) { for (var k in r) { t = t.split('{{' + rn + '.' + k + '}}').join(r[k] || ''); } }
      });
      return t;
    }

    function run() {
      state.running = true; state.done = false; state.output = null; render();
      setTimeout(function() {
        var recs = DMOs[state.template.primaryDMO].records;
        var rec = recs[state.recordIdx];
        var idKey = Object.keys(rec).find(function(k) { return k.indexOf('Id') > -1; });
        var id = rec[idKey];

        // Check for existing mock output
        var mockOutput = (MOCK_OUTPUTS[state.template.id] || {})[id];

        // For custom templates or missing mocks, generate sample output based on output fields
        if (!mockOutput && state.template.outputFields) {
          mockOutput = {};
          state.template.outputFields.forEach(function(field) {
            // Generate sample values based on common field name patterns
            var lowerField = field.toLowerCase();
            if (lowerField.includes('sentiment')) {
              mockOutput[field] = ['Positive', 'Negative', 'Neutral'][Math.floor(Math.random() * 3)];
            } else if (lowerField.includes('category') || lowerField.includes('type')) {
              mockOutput[field] = 'Category A';
            } else if (lowerField.includes('score') || lowerField.includes('rating')) {
              mockOutput[field] = Math.floor(Math.random() * 5) + 1;
            } else if (lowerField.includes('urgency') || lowerField.includes('priority')) {
              mockOutput[field] = ['High', 'Medium', 'Low'][Math.floor(Math.random() * 3)];
            } else if (lowerField.includes('summary') || lowerField.includes('description')) {
              mockOutput[field] = 'AI-generated summary based on the input data provided.';
            } else if (lowerField.includes('recommend') || lowerField.includes('action') || lowerField.includes('next')) {
              mockOutput[field] = 'Recommended action based on analysis of the input.';
            } else if (lowerField.includes('risk')) {
              mockOutput[field] = ['High', 'Medium', 'Low'][Math.floor(Math.random() * 3)] + ' - Based on analysis';
            } else if (lowerField.includes('list') || lowerField.includes('items') || lowerField.includes('tags')) {
              mockOutput[field] = ['Item 1', 'Item 2', 'Item 3'];
            } else {
              mockOutput[field] = 'Generated value for ' + field;
            }
          });
        }

        state.output = mockOutput || { message: 'No mock output available' };
        state.running = false; state.done = true; render();
      }, 1500);
    }

    function toggleBulkMode() {
      state.bulkMode = !state.bulkMode;
      state.bulkResults = [];
      state.bulkProgress = 0;
      render();
    }

    function runBulk() {
      var recs = DMOs[state.template.primaryDMO].records;
      state.running = true;
      state.bulkResults = [];
      state.bulkProgress = 0;
      render();

      var processRecord = function(idx) {
        if (idx >= recs.length) {
          state.running = false;
          state.done = true;
          render();
          return;
        }

        var rec = recs[idx];
        var idKey = Object.keys(rec).find(function(k) { return k.indexOf('Id') > -1; });
        var id = rec[idKey];
        var mockOutput = (MOCK_OUTPUTS[state.template.id] || {})[id];

        // Generate mock if not exists
        if (!mockOutput && state.template.outputFields) {
          mockOutput = {};
          state.template.outputFields.forEach(function(field) {
            var lowerField = field.toLowerCase();
            if (lowerField.includes('confidence')) mockOutput[field] = 70 + Math.floor(Math.random() * 25);
            else if (lowerField.includes('safety')) mockOutput[field] = { needsReview: Math.random() > 0.7, reasons: [], riskLevel: Math.random() > 0.7 ? 'warning' : 'safe' };
            else mockOutput[field] = 'Generated for ' + field;
          });
        }

        var safetyFlag = mockOutput && mockOutput.SafetyFlags ? mockOutput.SafetyFlags : { riskLevel: 'safe' };
        state.bulkResults.push({
          id: id,
          title: rec.Subject || rec.Name || rec.NoteType || 'Record ' + (idx + 1),
          status: safetyFlag.riskLevel === 'warning' ? 'warning' : 'success',
          output: mockOutput
        });
        state.bulkProgress = ((idx + 1) / recs.length) * 100;
        render();

        setTimeout(function() { processRecord(idx + 1); }, 400);
      };

      processRecord(0);
    }

    function render() {
      var allTpls = getAllTemplates();
      var tpls = state.cloud === 'all' ? allTpls : allTpls.filter(function(t) { return t.cloud === state.cloud; });
      if (!tpls.find(function(t) { return t.id === state.template.id; })) { state.template = tpls[0]; state.recordIdx = 0; state.done = false; }
      var dmo = DMOs[state.template.primaryDMO];
      var recs = dmo.records;
      var rec = recs[state.recordIdx] || {};
      var prompt = resolve(state.template, rec);
      var inTok = tokens(prompt), outTok = state.output ? tokens(JSON.stringify(state.output)) : 500;

      var html = '<div class="container">' +
        '<header class="header"><div class="logo"><div class="logo-box"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></div><span class="logo-text">Content Foundry</span><span class="logo-sub">Playground</span></div>' +
        '<div class="header-right"><div class="model-select"><span style="color:#6b7280">Model:</span><select onchange="state.model=this.value"><option>gpt-4o</option><option>gpt-4o-mini</option><option>claude-3-5-sonnet</option></select></div><button class="btn-primary">Save Pipeline</button></div></header>' +
        '<div class="cloud-tabs"><button class="cloud-tab' + (state.cloud === 'all' ? ' active' : '') + '" onclick="state.cloud=\'all\';state.recordIdx=0;state.done=false;render()">All Clouds</button>';
      for (var c in CLOUDS) { html += '<button class="cloud-tab' + (state.cloud === c ? ' active' : '') + '" onclick="state.cloud=\'' + c + '\';state.recordIdx=0;state.done=false;render()">' + CLOUDS[c].icon + ' ' + CLOUDS[c].name + '</button>'; }
      // Get all fields from DMO
      var dmoFields = rec ? Object.keys(rec) : [];
      var inputFields = state.template.inputFields || [];
      var outputFields = state.template.outputFields || state.template.fields || [];

      html += '</div><div class="main-content"><aside class="sidebar-left"><div class="sidebar-section"><div class="use-case-header"><span class="sidebar-title" style="margin-bottom:0">🎯 Use Case</span><button class="plus-btn" onclick="openBuilder()" title="Create Custom Template">+</button></div><select class="sidebar-select" style="margin-top:12px" onchange="var t=getAllTemplates().find(function(t){return t.id===this.value}.bind(this));if(t){state.template=t;state.recordIdx=0;state.done=false;state.output=null;render()}">';
      tpls.forEach(function(t) {
        var badge = t.type === 'custom' ? ' [Custom]' : '';
        html += '<option value="' + t.id + '"' + (state.template.id === t.id ? ' selected' : '') + '>' + t.name + badge + '</option>';
      });
      html += '</select><div class="sidebar-desc">' + state.template.desc + (state.template.type === 'custom' ? '<span class="template-type-badge custom">Custom</span>' : '') + '</div><div class="cloud-badge badge-' + state.template.cloud + '">' + CLOUDS[state.template.cloud].icon + ' ' + CLOUDS[state.template.cloud].name + '</div>' +
        (state.template.type === 'custom' ? '<button style="margin-top:8px;font-size:12px;color:#dc2626;background:none;border:none;cursor:pointer;text-decoration:underline;" onclick="if(confirm(\'Delete this custom template?\'))deleteCustomTemplate(\'' + state.template.id + '\')">Delete Template</button>' : '') +
        '</div>' +
        '<div class="sidebar-section"><div class="sidebar-title" style="display:flex;justify-content:space-between;align-items:center;">📊 Input DMOs<button class="field-selector-btn" onclick="openInputDMOSelector()">Edit</button></div>';

      // Show selected Input DMOs
      var selectedInputDMOs = getSelectedInputDMOs();
      selectedInputDMOs.forEach(function(dmoKey) {
        var d = DMOs[dmoKey];
        if (!d) return;
        var dFields = d.records[0] ? Object.keys(d.records[0]).length : 0;
        var isPrimary = dmoKey === state.template.primaryDMO;
        html += '<div class="dmo-info" style="margin-bottom:4px;"><span class="dmo-primary">' + d.icon + ' ' + d.name + '</span> <span style="font-size:12px;color:#6b7280">(' + dFields + ' fields)</span>' + (isPrimary ? ' <span style="font-size:9px;background:#9333ea;color:white;padding:1px 4px;border-radius:3px;">PRIMARY</span>' : '') + '</div>';
      });

      // Show Input Fields mapping with PII indicators - grouped by DMO
      var selectedFields = getSelectedFields();
      var totalFieldCount = getTotalSelectedFieldCount();
      var allSelectedFieldsList = [];
      for (var sfDmo in selectedFields) { allSelectedFieldsList = allSelectedFieldsList.concat(selectedFields[sfDmo]); }
      var piiCount = allSelectedFieldsList.filter(function(f) { return PII_FIELDS[f]; }).length;

      html += '<div class="mapping-header">📥 Input Fields (' + totalFieldCount + ')' + (piiCount > 0 ? ' <span class="pii-badge">🔒 ' + piiCount + ' PII</span>' : '') + '<button class="field-selector-btn" onclick="openFieldSelector()">Edit</button></div>';

      // Show fields grouped by DMO
      var allDMOsForFields = getSelectedInputDMOs();
      allDMOsForFields.forEach(function(dmoKey) {
        var dmoInfo = DMOs[dmoKey];
        if (!dmoInfo) return;
        var fieldsForDmo = selectedFields[dmoKey] || [];
        if (fieldsForDmo.length === 0) return;

        html += '<div class="input-field-group"><div class="input-field-group-header">' + dmoInfo.icon + ' ' + dmoInfo.name + ' (' + fieldsForDmo.length + ')</div>';
        fieldsForDmo.forEach(function(f) {
          var isPII = PII_FIELDS[f];
          html += '<span class="field-tag input' + (isPII ? ' pii' : '') + '">' + f + (isPII ? ' 🔒' : '') + '</span>';
        });
        html += '</div>';
      });

      // Show Output Fields mapping
      html += '<div class="mapping-header">📤 Output Fields (' + outputFields.length + ')</div><div class="output-fields-box fields-section">';
      outputFields.forEach(function(f) { html += '<span class="field-tag output">' + f + '</span>'; });
      html += '</div>';

      // Show all available DMO fields with PII indicators
      html += '<div class="mapping-header">📋 All DMO Fields (' + dmoFields.length + ')</div><div class="fields-section" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:8px;">';
      dmoFields.forEach(function(f) {
        var isInput = inputFields.indexOf(f) > -1;
        var isPII = PII_FIELDS[f];
        html += '<span class="field-tag ' + (isInput ? 'input' : 'available') + (isPII ? ' pii' : '') + '">' + f + (isPII ? ' 🔒' : '') + '</span>';
      });
      html += '</div></div><div class="records-list"><div class="records-title">Test Records (' + recs.length + ')</div>';
      recs.forEach(function(r, i) {
        var title = r.Subject || r.Name || r.NoteType || (r.OpenEndedFeedback || '').substring(0, 40) || (r.MessageText || '').substring(0, 40) || 'Record';
        var id = Object.values(r)[0];
        html += '<div class="record-item' + (state.recordIdx === i ? ' active' : '') + '" onclick="state.recordIdx=' + i + ';state.done=false;state.output=null;render()"><div class="record-title">' + esc(title) + '</div><div class="record-id">' + id + '</div></div>';
      });
      html += '</div><div class="usage-panel"><div class="usage-title">Estimated Usage</div><div class="usage-row"><span class="usage-label">Input</span><span class="usage-value">' + inTok + ' tokens</span></div><div class="usage-row"><span class="usage-label">Output</span><span class="usage-value">~' + outTok + ' tokens</span></div><div class="usage-row" style="border-top:1px solid #e5e7eb;padding-top:8px;margin-top:8px"><span class="usage-label">Est. Cost</span><span class="usage-value usage-cost">$' + ((inTok * 0.00001) + (outTok * 0.00003)).toFixed(4) + '</span></div></div></aside>' +
        '<main class="center-panel"><div class="center-header"><span class="center-title">' + state.template.name + '</span><div style="display:flex;align-items:center;gap:8px;"><div class="bulk-mode-toggle"><span style="font-size:12px;color:#6b7280;">Mode:</span><button class="bulk-toggle-btn' + (!state.bulkMode ? ' active' : '') + '" onclick="if(state.bulkMode)toggleBulkMode()">Single</button><button class="bulk-toggle-btn' + (state.bulkMode ? ' active' : '') + '" onclick="if(!state.bulkMode)toggleBulkMode()">Bulk (' + recs.length + ')</button></div><button class="run-btn" onclick="' + (state.bulkMode ? 'runBulk()' : 'run()') + '"' + (state.running ? ' disabled' : '') + '>' + (state.running ? '<svg class="spinner" width="16" height="16" viewBox="0 0 24 24"><circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Running...' : (state.bulkMode ? '▶ Run All (' + recs.length + ')' : '▶ Test Run')) + '</button></div></div>' +
        (state.bulkMode ? renderBulkMode(recs) : '<div class="panels"><div class="panel"><div class="panel-header"><span class="panel-title">📝 Resolved Prompt</span><span class="panel-tokens">' + inTok + ' tokens</span></div><div class="panel-content"><pre class="prompt-box">' + esc(prompt) + '</pre></div></div>' +
        '<div class="panel"><div class="panel-header"><span class="panel-title">✨ Generated Output</span><div class="format-btns"><button class="format-btn' + (state.format === 'structured' ? ' active' : '') + '" onclick="state.format=\'structured\';render()">Structured</button><button class="format-btn' + (state.format === 'raw' ? ' active' : '') + '" onclick="state.format=\'raw\';render()">JSON</button></div></div><div class="panel-content">' + renderOutput() + '</div></div></div>') + '</main>' +
        '<aside class="sidebar-right"><div class="sidebar-section"><div class="sidebar-title" style="display:flex;justify-content:space-between;align-items:center;">📤 Output DMO<button class="field-selector-btn" onclick="openOutputDMOSelector()">Edit</button></div>';
      var outputConfig = getSelectedOutputDMO();
      var outputDMO = outputConfig.mode === 'update' && DMOs[outputConfig.dmoKey] ? DMOs[outputConfig.dmoKey] : null;
      if (outputDMO) {
        html += '<div class="output-dmo-card" style="margin-top:8px;"><span class="output-dmo-icon">' + outputDMO.icon + '</span><div class="output-dmo-info"><div class="output-dmo-name">' + outputDMO.name + '</div><div class="output-dmo-fields">Adding ' + (state.template.outputFields || state.template.fields).length + ' fields</div></div></div>';
      } else {
        html += '<div class="output-dmo-card" style="margin-top:8px;"><span class="output-dmo-icon">✨</span><div class="output-dmo-info"><div class="output-dmo-name">' + (outputConfig.newDMOName || 'New DMO') + '</div><div class="output-dmo-fields">New DMO with ' + (state.template.outputFields || state.template.fields).length + ' fields</div></div></div>';
      }
      html += '</div><div class="fields-list"><div style="font-size:12px;color:#6b7280;text-transform:uppercase;margin-bottom:8px">Output Fields (' + state.template.fields.length + ')</div>';
      state.template.fields.forEach(function(f) { html += '<div class="field-item"><span class="field-name">' + f + '</span><span class="field-status ' + (state.done ? 'done' : 'pending') + '">' + (state.done ? '✓' : '...') + '</span></div>'; });
      html += '</div>' + (state.done ? '<div class="complete-panel"><div class="complete-title">✓ Test Complete</div><div class="complete-sub">All ' + state.template.fields.length + ' fields extracted</div></div>' : '') + '</aside></div></div>';

      // Add the Template Builder Modal
      html += renderBuilderModal();

      // Add the Field Selector Modal
      html += renderFieldSelectorModal();

      // Add the Input DMO Selector Modal
      html += renderInputDMOSelectorModal();

      // Add the Output DMO Selector Modal
      html += renderOutputDMOSelectorModal();

      document.getElementById('app').innerHTML = html;
    }

    function renderBulkMode(recs) {
      var html = '<div class="panels" style="flex-direction:column;">';

      // Progress section
      if (state.running || state.bulkResults.length > 0) {
        var successCount = state.bulkResults.filter(function(r) { return r.status === 'success'; }).length;
        var warningCount = state.bulkResults.filter(function(r) { return r.status === 'warning'; }).length;

        html += '<div class="panel" style="flex:none;"><div class="panel-header"><span class="panel-title">📊 Bulk Processing Progress</span></div><div class="panel-content">' +
          '<div class="bulk-progress"><div class="bulk-progress-bar"><div class="bulk-progress-fill" style="width:' + state.bulkProgress + '%"></div></div>' +
          '<div class="bulk-stats"><span>✅ ' + successCount + ' Safe</span><span>⚠️ ' + warningCount + ' Need Review</span><span>📄 ' + state.bulkResults.length + '/' + recs.length + ' Processed</span></div></div></div></div>';
      }

      // Results list
      html += '<div class="panel" style="flex:1;overflow:auto;"><div class="panel-header"><span class="panel-title">📋 Results</span></div><div class="panel-content" style="padding:0;">';

      if (state.bulkResults.length === 0 && !state.running) {
        html += '<div class="output-placeholder"><div class="output-placeholder-icon">▶</div><div>Click "Run All" to process ' + recs.length + ' records</div></div>';
      } else {
        state.bulkResults.forEach(function(result, idx) {
          html += '<div class="bulk-result-item">' +
            '<div><div style="font-weight:500;font-size:14px;">' + esc(result.title) + '</div><div style="font-size:12px;color:#6b7280;">' + result.id + '</div></div>' +
            '<span class="bulk-result-status ' + result.status + '">' + (result.status === 'success' ? '✓ Safe' : '⚠️ Review') + '</span></div>';
        });
      }

      html += '</div></div></div>';
      return html;
    }

    function renderOutput() {
      if (state.running) return '<div class="output-placeholder"><svg class="spinner" width="40" height="40" viewBox="0 0 24 24" style="color:#9333ea"><circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><div>Generating with ' + state.model + '...</div></div>';
      if (!state.done) return '<div class="output-placeholder"><div class="output-placeholder-icon">▶</div><div>Click "Test Run" to generate</div></div>';
      if (state.format === 'raw') return '<pre class="output-json">' + JSON.stringify(state.output, null, 2) + '</pre>';
      var html = '';

      // Render special fields first (safety, confidence, language)
      if (state.output.SafetyFlags || state.output.ConfidenceScore || state.output.DetectedLanguage) {
        html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:12px;background:#f9fafb;border-radius:8px;">';
        if (state.output.ConfidenceScore !== undefined) {
          var confLevel = state.output.ConfidenceScore >= 85 ? 'high' : (state.output.ConfidenceScore >= 70 ? 'medium' : 'low');
          html += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:#6b7280;margin-bottom:4px;">Confidence Score</div><div style="font-size:20px;font-weight:600;color:' + (confLevel === 'high' ? '#22c55e' : confLevel === 'medium' ? '#f59e0b' : '#ef4444') + ';">' + state.output.ConfidenceScore + '%</div><div class="confidence-bar"><div class="confidence-fill ' + confLevel + '" style="width:' + state.output.ConfidenceScore + '%;"></div></div></div>';
        }
        if (state.output.SafetyFlags) {
          var sf = state.output.SafetyFlags;
          html += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:#6b7280;margin-bottom:4px;">Safety Status</div><div class="safety-flag ' + sf.riskLevel + '">' + (sf.riskLevel === 'safe' ? '✓ Safe to Send' : sf.riskLevel === 'warning' ? '⚠️ Review Recommended' : '🚨 Needs Review') + '</div>';
          if (sf.reasons && sf.reasons.length > 0) {
            html += '<ul style="font-size:11px;color:#6b7280;margin:8px 0 0 16px;">';
            sf.reasons.forEach(function(r) { html += '<li>' + esc(r) + '</li>'; });
            html += '</ul>';
          }
          html += '</div>';
        }
        if (state.output.DetectedLanguage) {
          var dl = state.output.DetectedLanguage;
          html += '<div style="flex:1;min-width:150px;"><div style="font-size:11px;color:#6b7280;margin-bottom:4px;">Language</div><div class="language-badge">🌐 ' + dl.name + ' (' + dl.output + ')</div></div>';
        }
        html += '</div>';
      }

      // Render grounding sources
      if (state.output.GroundingSources && state.output.GroundingSources.length > 0) {
        html += '<div class="output-card"><div class="output-label">📌 Grounding Sources</div><div>';
        state.output.GroundingSources.forEach(function(src) { html += '<span class="grounding-source">' + esc(src) + '</span>'; });
        html += '</div></div>';
      }

      for (var k in state.output) {
        // Skip special fields already rendered
        if (['SafetyFlags', 'ConfidenceScore', 'DetectedLanguage', 'GroundingSources', 'AlternativeReplies'].indexOf(k) > -1) continue;

        var v = state.output[k];
        var cls = '';
        if (k === 'Urgency' && String(v).indexOf('URGENT') > -1) cls = 'urgent';
        else if ((k === 'ChurnRisk' || k === 'DealRisk') && v === 'High') cls = 'high';
        else if (k === 'Sentiment' && v === 'Positive') cls = 'positive';
        else if (k === 'Sentiment' && v === 'Negative') cls = 'negative';
        else if (k === 'RoutingQueue' && v === '911/ED') cls = 'urgent';
        html += '<div class="output-card"><div class="output-label">' + k + '</div>';
        if (Array.isArray(v)) {
          if (v.length && typeof v[0] === 'object') {
            v.forEach(function(item) { html += '<div class="output-obj">'; for (var ik in item) { html += '<div class="output-obj-row"><span class="output-obj-key">' + ik + ':</span> ' + esc(String(item[ik])) + '</div>'; } html += '</div>'; });
          } else {
            html += '<ul class="output-list">'; v.forEach(function(x) { html += '<li>' + esc(String(x)) + '</li>'; }); html += '</ul>';
          }
        } else if (typeof v === 'object' && v) {
          html += '<div class="output-obj">'; for (var ok in v) { html += '<div class="output-obj-row"><span class="output-obj-key">' + ok + ':</span> ' + esc(String(v[ok])) + '</div>'; } html += '</div>';
        } else {
          html += '<div class="output-value ' + cls + '">' + esc(String(v)) + '</div>';
        }
        html += '</div>';
      }

      // Render alternative replies at the end
      if (state.output.AlternativeReplies && state.output.AlternativeReplies.length > 0) {
        html += '<div class="output-card"><div class="output-label">💡 Alternative Approaches</div>';
        state.output.AlternativeReplies.forEach(function(alt, i) {
          html += '<div class="alternative-reply"><div class="alternative-reply-header">Option ' + (i + 1) + ' - ' + alt.tone + ' tone</div><div style="font-weight:500;margin-bottom:4px;">' + esc(alt.subject) + '</div><div style="font-size:13px;color:#6b7280;">' + esc(alt.preview) + '</div></div>';
        });
        html += '</div>';
      }

      return html;
    }

    render();
  </script>
</body>
</html>
