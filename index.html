<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Foundry - Multi-Cloud Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; }
    .container { min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: white; border-bottom: 1px solid #e5e7eb; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-box { width: 32px; height: 32px; background: linear-gradient(135deg, #9333ea, #3b82f6); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-box svg { width: 20px; height: 20px; color: white; }
    .logo-text { font-weight: 600; color: #1f2937; }
    .logo-sub { font-size: 12px; color: #6b7280; margin-left: 4px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .model-select { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .model-select select { border: 1px solid #e5e7eb; border-radius: 4px; padding: 4px 8px; font-size: 14px; }
    .btn-primary { background: #9333ea; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; }
    .btn-primary:hover { background: #7e22ce; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .cloud-tabs { background: white; border-bottom: 1px solid #e5e7eb; padding: 0 16px; display: flex; gap: 4px; }
    .cloud-tab { padding: 8px 16px; font-size: 14px; font-weight: 500; color: #6b7280; background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; }
    .cloud-tab:hover { color: #374151; }
    .cloud-tab.active { color: #9333ea; border-bottom-color: #9333ea; }

    .main-content { display: flex; flex: 1; overflow: hidden; }

    .sidebar-left { width: 320px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
    .sidebar-section { padding: 16px; border-bottom: 1px solid #e5e7eb; }
    .sidebar-title { font-weight: 600; color: #1f2937; margin-bottom: 12px; }
    .sidebar-select { width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
    .sidebar-desc { font-size: 12px; color: #6b7280; margin-top: 8px; }

    .cloud-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; display: inline-block; margin-top: 8px; }
    .badge-service { background: #dbeafe; color: #1e40af; }
    .badge-sales { background: #dcfce7; color: #166534; }
    .badge-marketing { background: #fce7f3; color: #9d174d; }
    .badge-health { background: #fef3c7; color: #92400e; }

    .dmo-info { background: #f9fafb; border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 14px; }
    .dmo-primary { font-weight: 500; }
    .dmo-related { font-size: 12px; color: #6b7280; margin-top: 4px; }

    .records-list { flex: 1; overflow-y: auto; padding: 16px; }
    .records-title { font-size: 12px; color: #6b7280; text-transform: uppercase; margin-bottom: 8px; }
    .record-item { padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .record-item:hover { background: #f9fafb; }
    .record-item.active { background: #faf5ff; border-color: #d8b4fe; }
    .record-title { font-size: 14px; font-weight: 500; color: #1f2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record-id { font-size: 12px; color: #6b7280; }

    .usage-panel { padding: 16px; background: #f9fafb; border-top: 1px solid #e5e7eb; font-size: 14px; }
    .usage-title { font-size: 12px; color: #6b7280; text-transform: uppercase; margin-bottom: 8px; }
    .usage-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .usage-label { color: #4b5563; }
    .usage-value { font-weight: 500; }
    .usage-cost { color: #16a34a; }

    .center-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .center-header { background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .center-title { font-size: 18px; }
    .run-btn { display: flex; align-items: center; gap: 8px; background: #9333ea; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; }
    .run-btn:hover { background: #7e22ce; }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .panels { display: flex; flex: 1; overflow: hidden; }
    .panel { width: 50%; display: flex; flex-direction: column; }
    .panel:first-child { border-right: 1px solid #e5e7eb; }
    .panel-header { padding: 8px 16px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .panel-title { font-weight: 600; color: #1f2937; font-size: 14px; }
    .panel-tokens { font-size: 12px; color: #6b7280; }
    .panel-content { flex: 1; overflow-y: auto; padding: 16px; }

    .prompt-box { font-size: 14px; white-space: pre-wrap; font-family: monospace; background: #f9fafb; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; color: #374151; }

    .output-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #9ca3af; }
    .output-placeholder-icon { font-size: 48px; margin-bottom: 8px; }

    .format-btns { display: flex; gap: 4px; }
    .format-btn { padding: 4px 8px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; background: transparent; color: #6b7280; }
    .format-btn.active { background: #f3e8ff; color: #7e22ce; }

    .output-card { padding: 12px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 12px; }
    .output-label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 500; margin-bottom: 4px; }
    .output-value { font-size: 14px; white-space: pre-wrap; }
    .output-value.urgent { color: #dc2626; font-weight: 700; background: #fef2f2; padding: 4px 8px; border-radius: 4px; }
    .output-value.high { color: #ea580c; font-weight: 600; }
    .output-value.positive { color: #16a34a; font-weight: 500; }
    .output-value.negative { color: #dc2626; }
    .output-list { list-style: disc; list-style-position: inside; font-size: 14px; }
    .output-list li { margin-bottom: 4px; }
    .output-obj { background: #f9fafb; padding: 8px; border-radius: 4px; font-size: 12px; margin-top: 4px; }
    .output-obj-row { margin-bottom: 2px; }
    .output-obj-key { color: #6b7280; }
    .output-json { font-size: 12px; font-family: monospace; background: #111827; color: #4ade80; padding: 16px; border-radius: 8px; white-space: pre-wrap; overflow: auto; }

    .sidebar-right { width: 288px; background: white; border-left: 1px solid #e5e7eb; display: flex; flex-direction: column; }
    .fields-list { flex: 1; overflow-y: auto; padding: 16px; }
    .field-item { padding: 8px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .field-name { font-size: 14px; font-weight: 500; }
    .field-status { font-size: 12px; padding: 2px 8px; border-radius: 9999px; }
    .field-status.pending { background: #e5e7eb; color: #6b7280; }
    .field-status.done { background: #dcfce7; color: #166534; }

    .complete-panel { padding: 16px; background: #f0fdf4; border-top: 1px solid #e5e7eb; }
    .complete-title { display: flex; align-items: center; gap: 8px; color: #15803d; font-weight: 500; margin-bottom: 4px; }
    .complete-sub { font-size: 12px; color: #16a34a; }

    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

      { id: 'voc-analysis', cloud: 'marketing', name: '🎯 VoC Analysis', desc: 'Analyze survey feedback for insights', primaryDMO: 'SurveyResponse__dlm', relatedDMOs: [], fields: ['SentimentScore', 'KeyThemes', 'ChurnRisk', 'Action'], prompt: 'Analyze feedback:\n\n**Survey:** {{SurveyResponse.SurveyName}}\n**Rating:** {{SurveyResponse.Rating}}/10\n**Feedback:**\n{{SurveyResponse.OpenEndedFeedback}}' },
      { id: 'dynamic-content', cloud: 'marketing', name: '✨ Dynamic Content', desc: 'Create personalized marketing content', primaryDMO: 'UnifiedProfile__dlm', relatedDMOs: [], fields: ['HeroBanner', 'EmailSubject', 'Offer'], prompt: 'Create content for:\n\n**Customer:** {{UnifiedProfile.Name}}\n**Status:** {{UnifiedProfile.LoyaltyStatus}}\n**LTV:** {{UnifiedProfile.LTV}}\n**Last:** {{UnifiedProfile.LastInteraction}}\n**Prefs:** {{UnifiedProfile.Preferences}}' },
      { id: 'clinical-summary', cloud: 'health', name: '🩺 Clinical Summary', desc: 'De-identify and summarize clinical notes', primaryDMO: 'ClinicalNote__dlm', relatedDMOs: [], fields: ['DeidentifiedNote', 'Medications', 'Conditions', 'Summary'], prompt: 'Process clinical note:\n\n**Type:** {{ClinicalNote.NoteType}}\n**Provider:** {{ClinicalNote.Provider}}\n**Text:**\n{{ClinicalNote.ClinicalText}}' },
      { id: 'message-triage', cloud: 'health', name: '💬 Message Triage', desc: 'Classify patient messages for routing', primaryDMO: 'PatientMessage__dlm', relatedDMOs: [], fields: ['Intent', 'Urgency', 'Symptoms', 'RoutingQueue', 'Response'], prompt: 'Triage message:\n\n**Patient:** {{PatientMessage.PatientName}}\n**Time:** {{PatientMessage.Timestamp}}\n**Message:**\n{{PatientMessage.MessageText}}' }
    ];

    var MOCK_OUTPUTS = {
      'case-triage': {
        'EMAIL-001': { Sentiment: 'Negative', IssueCategory: 'Technical Support', Urgency: 'High', Summary: 'Customer blocked by file upload error E-5502 for files over 25MB' },
        'EMAIL-002': { Sentiment: 'Positive', IssueCategory: 'Feature Request', Urgency: 'Low', Summary: 'Happy customer requesting PDF export feature' }
      },
      'knowledge-gen': {
        'CASE-R001': { ArticleTitle: 'Fix Expired OAuth Token Errors', Summary: 'If your API stops working, the OAuth token may have expired.', Steps: ['Go to Setup > Connected Apps', 'Generate new key', 'Update your app config', 'Test connection'], Keywords: ['OAuth', 'API', 'token', 'authentication'] },
        'CASE-R002': { ArticleTitle: 'Fix Incorrect Timezone in Reports', Summary: 'Reports showing wrong timezone can be fixed in settings.', Steps: ['Click profile picture', 'Go to Settings', 'Select Time & Language', 'Choose correct timezone'], Keywords: ['timezone', 'reports', 'settings'] }
      },
      'call-insights': {
        'CALL-001': { Objections: ['Price higher than Competitor X ($100k vs $150k)'], BuyingSignals: ['Asked about timeline', 'Values uptime', 'Willing to schedule call'], DealRisk: 'Medium', NextAction: 'Send project plan with ROI analysis vs Competitor X' },
        'CALL-002': { Objections: [], BuyingSignals: ['Team loves demo', 'Asked about scaling', 'Wants procurement call'], DealRisk: 'Low', NextAction: 'Schedule procurement call immediately - deal is hot' }
      },
      'email-followup': {
        'ACC-1001': { SubjectLine: 'Acme Deployment - Project Timeline', EmailBody: 'Hi,\n\nAttached is our 6-week implementation plan for manufacturing.\n\nOur Enterprise tier includes:\n- 99.9% uptime SLA\n- 24/7 support\n- Dedicated CSM\n\nCan we schedule a call Thursday?\n\nBest regards', CallToAction: 'Schedule call Thursday' },
        'ACC-1002': { SubjectLine: 'TechStart - Ready to finalize?', EmailBody: 'Hi Sarah,\n\nGreat speaking with you! We integrate with both AWS and Azure.\n\nCan we get procurement on a call Monday?\n\nLooking forward to partnering!', CallToAction: 'Book procurement call Monday' }
      },
      'voc-analysis': {
        'SURV-001': { SentimentScore: -0.8, KeyThemes: ['Website UI', 'Customer Service'], ChurnRisk: 'High', Action: 'Immediate outreach from Customer Success' },
        'SURV-002': { SentimentScore: 0.9, KeyThemes: ['Product Quality', 'Shipping'], ChurnRisk: 'Low', Action: 'Add to Brand Advocates, send referral invite' },
        'SURV-003': { SentimentScore: 0.1, KeyThemes: ['Battery', 'App Performance'], ChurnRisk: 'Medium', Action: 'Send battery tips, offer upgrade discount' }
      },
      'dynamic-content': {
        'UP-001': { HeroBanner: 'Jennifer, we apologize for the delay. As a Gold member, here is 15% off your next eco-friendly purchase.', EmailSubject: 'Jennifer, a personal apology + 15% off', Offer: '15% off (code: SORRY15), free expedited shipping' },
        'UP-002': { HeroBanner: 'Robert, as Platinum you get first access to our newest tech drop!', EmailSubject: 'Robert: Platinum Early Access', Offer: '48-hour early access, extra 10% off' }
      },
      'clinical-summary': {
        'CN-001': { DeidentifiedNote: '[PATIENT], 58yo male, diabetes/HTN follow-up. Good compliance. BP and weight improved.', Medications: [{ name: 'Metformin', dose: '1000mg BID' }, { name: 'Lisinopril', dose: '20mg daily' }], Conditions: ['Type 2 Diabetes (E11.9)', 'Hypertension (I10)'], Summary: ['Diabetes improving', 'Blood pressure at goal', 'Continue current meds', 'Follow up 3 months'] },
        'CN-002': { DeidentifiedNote: '[PATIENT], 45yo female, new patient for anxiety. Sleep difficulty, racing thoughts.', Medications: [{ name: 'Sertraline', dose: '25mg daily' }], Conditions: ['Generalized Anxiety (F41.1)', 'Insomnia (G47.00)'], Summary: ['Starting anxiety medication', 'Takes 2-4 weeks to work', 'Referral to counselor'] }
      },
      'message-triage': {
        'PM-001': { Intent: 'Medication Refill', Urgency: 'Medium - 24-48 hrs', Symptoms: ['Dizziness when standing'], RoutingQueue: 'Pharmacy + Nursing', Response: 'Refill sent to CVS. Dizziness can be a side effect - rise slowly. Contact us if it persists.' },
        'PM-002': { Intent: 'Billing Question', Urgency: 'Low - 3-5 days', Symptoms: [], RoutingQueue: 'Billing', Response: 'Forwarded to billing team. They will contact you within 3-5 business days.' },
        'PM-003': { Intent: 'Urgent Medical', Urgency: 'URGENT - Immediate', Symptoms: ['Chest pain 1 hour', 'Pain to left arm', 'Sweating', 'Nausea'], RoutingQueue: '911/ED', Response: 'EMERGENCY: Possible heart attack symptoms. Call 911 immediately or go to nearest ER.' },
        'PM-004': { Intent: 'Appointment Scheduling', Urgency: 'Low - 3-5 days', Symptoms: [], RoutingQueue: 'Scheduling', Response: 'Happy to schedule! Please fast 10-12 hours before appointment for bloodwork.' }
      }
    };

    var state = { cloud: 'all', template: TEMPLATES[0], recordIdx: 0, running: false, done: false, output: null, model: 'gpt-4o', format: 'structured' };

    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function tokens(t) { return Math.ceil((t || '').length / 4); }

    function resolve(tpl, rec) {
      var t = tpl.prompt;
      var name = tpl.primaryDMO.replace('__dlm', '');
      for (var k in rec) { t = t.split('{{' + name + '.' + k + '}}').join(rec[k] || ''); }
      tpl.relatedDMOs.forEach(function(rd) {
        var rn = rd.replace('__dlm', '');
        var recs = DMOs[rd] ? DMOs[rd].records : [];
        var r = recs.find(function(x) { return x.AccountId === rec.AccountId || x.OpportunityId === rec.OpportunityId; }) || recs[0];
        if (r) { for (var k in r) { t = t.split('{{' + rn + '.' + k + '}}').join(r[k] || ''); } }
      });
      return t;
    }

    function run() {
      state.running = true; state.done = false; state.output = null; render();
      setTimeout(function() {
        var recs = DMOs[state.template.primaryDMO].records;
        var rec = recs[state.recordIdx];
        var idKey = Object.keys(rec).find(function(k) { return k.indexOf('Id') > -1; });
        var id = rec[idKey];
        state.output = (MOCK_OUTPUTS[state.template.id] || {})[id] || { message: 'No mock output' };
        state.running = false; state.done = true; render();
      }, 1500);
    }

    function render() {
      var tpls = state.cloud === 'all' ? TEMPLATES : TEMPLATES.filter(function(t) { return t.cloud === state.cloud; });
      if (!tpls.find(function(t) { return t.id === state.template.id; })) { state.template = tpls[0]; state.recordIdx = 0; state.done = false; }
      var dmo = DMOs[state.template.primaryDMO];
      var recs = dmo.records;
      var rec = recs[state.recordIdx] || {};
      var prompt = resolve(state.template, rec);
      var inTok = tokens(prompt), outTok = state.output ? tokens(JSON.stringify(state.output)) : 500;

      var html = '<div class="container">' +
        '<header class="header"><div class="logo"><div class="logo-box"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg></div><span class="logo-text">Content Foundry</span><span class="logo-sub">Playground</span></div>' +
        '<div class="header-right"><div class="model-select"><span style="color:#6b7280">Model:</span><select onchange="state.model=this.value"><option>gpt-4o</option><option>gpt-4o-mini</option><option>claude-3-5-sonnet</option></select></div><button class="btn-primary">Save Pipeline</button></div></header>' +
        '<div class="cloud-tabs"><button class="cloud-tab' + (state.cloud === 'all' ? ' active' : '') + '" onclick="state.cloud=\'all\';state.recordIdx=0;state.done=false;render()">All Clouds</button>';
      for (var c in CLOUDS) { html += '<button class="cloud-tab' + (state.cloud === c ? ' active' : '') + '" onclick="state.cloud=\'' + c + '\';state.recordIdx=0;state.done=false;render()">' + CLOUDS[c].icon + ' ' + CLOUDS[c].name + '</button>'; }
      html += '</div><div class="main-content"><aside class="sidebar-left"><div class="sidebar-section"><div class="sidebar-title">🎯 Use Case</div><select class="sidebar-select" onchange="state.template=TEMPLATES.find(function(t){return t.id===this.value}.bind(this));state.recordIdx=0;state.done=false;state.output=null;render()">';
      tpls.forEach(function(t) { html += '<option value="' + t.id + '"' + (state.template.id === t.id ? ' selected' : '') + '>' + t.name + '</option>'; });
      html += '</select><div class="sidebar-desc">' + state.template.desc + '</div><div class="cloud-badge badge-' + state.template.cloud + '">' + CLOUDS[state.template.cloud].icon + ' ' + CLOUDS[state.template.cloud].name + '</div></div>' +
        '<div class="sidebar-section"><div class="sidebar-title">📊 Data Source</div><div class="dmo-info"><span class="dmo-primary">' + dmo.icon + ' ' + dmo.name + '</span> <span style="font-size:12px;color:#6b7280">(Primary)</span></div>';
      if (state.template.relatedDMOs.length) { state.template.relatedDMOs.forEach(function(rd) { var d = DMOs[rd]; html += '<div class="dmo-related">+ ' + d.icon + ' ' + d.name + '</div>'; }); }
      html += '</div><div class="records-list"><div class="records-title">Test Records (' + recs.length + ')</div>';
      recs.forEach(function(r, i) {
        var title = r.Subject || r.Name || r.NoteType || (r.OpenEndedFeedback || '').substring(0, 40) || (r.MessageText || '').substring(0, 40) || 'Record';
        var id = Object.values(r)[0];
        html += '<div class="record-item' + (state.recordIdx === i ? ' active' : '') + '" onclick="state.recordIdx=' + i + ';state.done=false;state.output=null;render()"><div class="record-title">' + esc(title) + '</div><div class="record-id">' + id + '</div></div>';
      });
      html += '</div><div class="usage-panel"><div class="usage-title">Estimated Usage</div><div class="usage-row"><span class="usage-label">Input</span><span class="usage-value">' + inTok + ' tokens</span></div><div class="usage-row"><span class="usage-label">Output</span><span class="usage-value">~' + outTok + ' tokens</span></div><div class="usage-row" style="border-top:1px solid #e5e7eb;padding-top:8px;margin-top:8px"><span class="usage-label">Est. Cost</span><span class="usage-value usage-cost">$' + ((inTok * 0.00001) + (outTok * 0.00003)).toFixed(4) + '</span></div></div></aside>' +
        '<main class="center-panel"><div class="center-header"><span class="center-title">' + state.template.name + '</span><button class="run-btn" onclick="run()"' + (state.running ? ' disabled' : '') + '>' + (state.running ? '<svg class="spinner" width="16" height="16" viewBox="0 0 24 24"><circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Running...' : '▶ Test Run') + '</button></div>' +
        '<div class="panels"><div class="panel"><div class="panel-header"><span class="panel-title">📝 Resolved Prompt</span><span class="panel-tokens">' + inTok + ' tokens</span></div><div class="panel-content"><pre class="prompt-box">' + esc(prompt) + '</pre></div></div>' +
        '<div class="panel"><div class="panel-header"><span class="panel-title">✨ Generated Output</span><div class="format-btns"><button class="format-btn' + (state.format === 'structured' ? ' active' : '') + '" onclick="state.format=\'structured\';render()">Structured</button><button class="format-btn' + (state.format === 'raw' ? ' active' : '') + '" onclick="state.format=\'raw\';render()">JSON</button></div></div><div class="panel-content">' + renderOutput() + '</div></div></div></main>' +
        '<aside class="sidebar-right"><div class="sidebar-section"><div class="sidebar-title">📤 Output Mapping</div><div class="sidebar-desc">Map fields to target DMO</div></div><div class="sidebar-section"><div style="font-size:12px;color:#6b7280;margin-bottom:4px">Target DMO</div><select class="sidebar-select"><option>' + dmo.icon + ' ' + dmo.name + ' (Update)</option><option>📊 ' + dmo.name + '_Enriched (New)</option></select></div><div class="fields-list"><div style="font-size:12px;color:#6b7280;text-transform:uppercase;margin-bottom:8px">Output Fields (' + state.template.fields.length + ')</div>';
      state.template.fields.forEach(function(f) { html += '<div class="field-item"><span class="field-name">' + f + '</span><span class="field-status ' + (state.done ? 'done' : 'pending') + '">' + (state.done ? '✓' : '...') + '</span></div>'; });
      html += '</div>' + (state.done ? '<div class="complete-panel"><div class="complete-title">✓ Test Complete</div><div class="complete-sub">All ' + state.template.fields.length + ' fields extracted</div></div>' : '') + '</aside></div></div>';
      document.getElementById('app').innerHTML = html;
    }

    function renderOutput() {
      if (state.running) return '<div class="output-placeholder"><svg class="spinner" width="40" height="40" viewBox="0 0 24 24" style="color:#9333ea"><circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><div>Generating with ' + state.model + '...</div></div>';
      if (!state.done) return '<div class="output-placeholder"><div class="output-placeholder-icon">▶</div><div>Click "Test Run" to generate</div></div>';
      if (state.format === 'raw') return '<pre class="output-json">' + JSON.stringify(state.output, null, 2) + '</pre>';
      var html = '';
      for (var k in state.output) {
        var v = state.output[k];
        var cls = '';
        if (k === 'Urgency' && String(v).indexOf('URGENT') > -1) cls = 'urgent';
        else if ((k === 'ChurnRisk' || k === 'DealRisk') && v === 'High') cls = 'high';
        else if (k === 'Sentiment' && v === 'Positive') cls = 'positive';
        else if (k === 'Sentiment' && v === 'Negative') cls = 'negative';
        else if (k === 'RoutingQueue' && v === '911/ED') cls = 'urgent';
        html += '<div class="output-card"><div class="output-label">' + k + '</div>';
        if (Array.isArray(v)) {
          if (v.length && typeof v[0] === 'object') {
            v.forEach(function(item) { html += '<div class="output-obj">'; for (var ik in item) { html += '<div class="output-obj-row"><span class="output-obj-key">' + ik + ':</span> ' + esc(String(item[ik])) + '</div>'; } html += '</div>'; });
          } else {
            html += '<ul class="output-list">'; v.forEach(function(x) { html += '<li>' + esc(String(x)) + '</li>'; }); html += '</ul>';
          }
        } else if (typeof v === 'object' && v) {
          html += '<div class="output-obj">'; for (var ok in v) { html += '<div class="output-obj-row"><span class="output-obj-key">' + ok + ':</span> ' + esc(String(v[ok])) + '</div>'; } html += '</div>';
        } else {
          html += '<div class="output-value ' + cls + '">' + esc(String(v)) + '</div>';
        }
        html += '</div>';
      }
      return html;
    }

    render();
  </script>
</body>
</html>
