    function renderStructuredOutput(obj, depth = 0) {

        const isNegative = (k === 'Sentiment' && v === 'Negative') || (k === 'SentimentScore' && v < -0.5);

        let valueHtml;
        if (Array.isArray(v)) {
          if (typeof v[0] === 'object') {
            valueHtml = `<div class="space-y-1 mt-1">${v.map(item => `<div class="bg-gray-50 p-2 rounded text-xs">${Object.entries(item).map(([ik,iv]) => `<div><span class="text-gray-500">${ik}:</span> ${esc(String(iv))}</div>`).join('')}</div>`).join('')}</div>`;

          }
        } else if (typeof v === 'object' && v !== null) {
          valueHtml = `<div class="bg-gray-50 p-2 rounded text-xs mt-1">${Object.entries(v).map(([ik,iv]) => `<div><span class="text-gray-500">${ik}:</span> ${esc(String(iv))}</div>`).join('')}</div>`;
        } else {
          const colorClass = isUrgent ? 'text-red-600 font-bold bg-red-50 px-2 py-1 rounded' :
                            isHigh ? 'text-orange-600 font-semibold' :
                            isNegative ? 'text-red-600' :
                            isPositive ? 'text-green-600 font-medium' : '';
          valueHtml = `<div class="text-sm ${colorClass} whitespace-pre-wrap">${esc(String(v))}</div>`;
        }

        return `<div class="p-3 bg-white rounded-lg border">
          <div class="text-xs text-gray-500 uppercase mb-1 font-medium">${k}</div>
          ${valueHtml}
        </div>`;
      }).join('');
    }

    render();
  </script>
</body>
</html>
