<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Foundry - Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="app"></div>

  <script>
    // ===================== MOCK DATA =====================
    const DMOs = {
      'Case__dlm': {
        name: 'Case', icon: '📋',
        records: [
          { CaseId: 'CASE-001', Subject: 'Urgent: System outage affecting production', Description: 'Our production environment has been down for 2 hours. We are losing approximately $50,000 per hour in revenue. Multiple teams are blocked. We need immediate escalation to your engineering team. This is completely unacceptable for the premium support tier we are paying for. I expect a call back within 15 minutes.', Priority: 'High', AccountId: 'ACC-1001', ContactEmail: 'john.smith@acmecorp.com' },
          { CaseId: 'CASE-002', Subject: 'Question about API rate limits', Description: 'Hi team, I was wondering if you could clarify the API rate limits for the Enterprise plan. We are planning to scale our integration and want to make sure we stay within bounds. Also, is there a way to request higher limits if needed? Thanks for your help!', Priority: 'Medium', AccountId: 'ACC-1002', ContactEmail: 'sarah.jones@techstart.io' },
          { CaseId: 'CASE-003', Subject: 'Billing discrepancy on invoice #INV-2024-0892', Description: 'I noticed we were charged $2,400 instead of $1,800 on our latest invoice. Looking at our contract, we should be on the Growth plan at $150/user for 12 users. Can you please review and issue a credit for the difference? Attached is our signed contract for reference.', Priority: 'Medium', AccountId: 'ACC-1003', ContactEmail: 'mike.chen@globallogistics.com' }
        ]
      },
      'Account__dlm': {
        name: 'Account', icon: '🏢',
        records: [
          { AccountId: 'ACC-1001', Name: 'Acme Corporation', Industry: 'Manufacturing', AnnualRevenue: '$2.4B', SupportTier: 'Premium', CustomerSince: '2019-03-15' },
          { AccountId: 'ACC-1002', Name: 'TechStart Inc', Industry: 'Software', AnnualRevenue: '$180M', SupportTier: 'Standard', CustomerSince: '2022-08-01' },
          { AccountId: 'ACC-1003', Name: 'Global Logistics Partners', Industry: 'Transportation', AnnualRevenue: '$5.1B', SupportTier: 'Premium', CustomerSince: '2020-01-10' }
        ]
      },
      'Contact__dlm': {
        name: 'Contact', icon: '👤',
        records: [
          { ContactId: 'CON-001', Email: 'john.smith@acmecorp.com', Name: 'John Smith', Title: 'VP of Engineering', AccountId: 'ACC-1001' },
          { ContactId: 'CON-002', Email: 'sarah.jones@techstart.io', Name: 'Sarah Jones', Title: 'Lead Developer', AccountId: 'ACC-1002' },
          { ContactId: 'CON-003', Email: 'mike.chen@globallogistics.com', Name: 'Mike Chen', Title: 'Finance Manager', AccountId: 'ACC-1003' }
        ]
      }
    };

    const TEMPLATES = [
      { id: 'triage', name: 'Case Triage & Categorization', desc: 'Extract category, sentiment, urgency, and routing', fields: ['Category', 'Sentiment', 'UrgencyScore', 'RecommendedTeam', 'KeyIssues', 'ResponseTone'],
        prompt: `Analyze the following support case and extract structured metadata.

**Case Subject:** {{Case.Subject}}
**Case Description:** {{Case.Description}}
**Account:** {{Account.Name}} ({{Account.SupportTier}} Support)
**Contact:** {{Contact.Name}}, {{Contact.Title}}

Extract: Category, Sentiment, Urgency Score (1-10), Recommended Team, Key Issues, Response Tone.
Respond in JSON format.` },
      { id: 'draft', name: 'Draft Response Email', desc: 'Generate personalized response email', fields: ['SubjectLine', 'DraftEmail', 'EstimatedResolutionTime'],
        prompt: `Draft a professional response email for this support case.

**Case Subject:** {{Case.Subject}}
**Case Description:** {{Case.Description}}
**Account:** {{Account.Name}} ({{Account.SupportTier}} tier, customer since {{Account.CustomerSince}})
**Contact:** {{Contact.Name}}, {{Contact.Title}}

Requirements: Address by name, acknowledge concern, provide next steps, match tone to sentiment.` },
      { id: 'summary', name: 'Case Summary', desc: 'Internal summary for handoff/escalation', fields: ['OneLiner', 'BusinessImpact', 'Priority', 'EscalationNeeded', 'EscalationReason'],
        prompt: `Create a concise internal summary of this case for team handoff.

**Case:** {{Case.CaseId}} - {{Case.Subject}}
**Description:** {{Case.Description}}
**Account:** {{Account.Name}} ({{Account.Industry}}, {{Account.AnnualRevenue}} ARR, {{Account.SupportTier}} tier)

Provide: One-liner, Business impact, Priority (P1-P4), Escalation needed (Yes/No + reason).` }
    ];

    const MOCK_OUTPUTS = {
      triage: {
        'CASE-001': { Category: 'Technical', Sentiment: 'Angry', UrgencyScore: 9, RecommendedTeam: 'Engineering', KeyIssues: ['Production outage', 'Revenue loss ($50k/hr)', 'SLA breach concern'], ResponseTone: 'Urgent, empathetic, action-oriented' },
        'CASE-002': { Category: 'General Inquiry', Sentiment: 'Positive', UrgencyScore: 3, RecommendedTeam: 'Support L1', KeyIssues: ['API rate limit clarification', 'Scaling planning', 'Limit increase process'], ResponseTone: 'Friendly, informative' },
        'CASE-003': { Category: 'Billing', Sentiment: 'Neutral', UrgencyScore: 5, RecommendedTeam: 'Billing', KeyIssues: ['Invoice discrepancy ($600)', 'Contract verification', 'Credit request'], ResponseTone: 'Professional, apologetic' }
      },
      draft: {
        'CASE-001': { SubjectLine: 'RE: Urgent - Production Outage - Engineering Engaged', DraftEmail: `Dear John,\n\nI understand how critical this is. We're treating this with highest priority.\n\nOur engineering team is investigating now. As a Premium customer, you have our 15-minute response SLA commitment.\n\n**Actions Taken:**\n• Senior Engineer assigned\n• Incident bridge opened\n• Executive escalation initiated\n\nI will call you within 10 minutes with an update.\n\nBest regards,\nSupport Team`, EstimatedResolutionTime: '2-4 hours' },
        'CASE-002': { SubjectLine: 'RE: API Rate Limits - Happy to Help!', DraftEmail: `Hi Sarah,\n\nGreat question!\n\nFor Enterprise plan:\n• 10,000 requests/minute\n• 1,000,000 requests/day\n• Burst capacity up to 15,000 rpm\n\n**Need Higher Limits?**\nWe can submit an increase request - typically approved within 2-3 business days.\n\nLet me know!\n\nBest,\nSupport Team`, EstimatedResolutionTime: 'Resolved' },
        'CASE-003': { SubjectLine: 'RE: Invoice #INV-2024-0892 - Credit Being Processed', DraftEmail: `Dear Mike,\n\nApologies for the billing discrepancy.\n\nI've confirmed you're on Growth plan at $150/user × 12 users = $1,800. The $2,400 charge was our error.\n\n**Resolution:**\n• $600 credit initiated\n• Reflected on next statement\n• Account flagged to prevent recurrence\n\nThank you for your patience.\n\nBest regards,\nSupport Team`, EstimatedResolutionTime: '3-5 business days' }
      },
      summary: {
        'CASE-001': { OneLiner: 'Production outage at Acme Corp - $50k/hr loss, Premium customer', BusinessImpact: 'CRITICAL - $2.4B customer, complete production failure, $50k/hr revenue impact, Premium SLA at risk', Priority: 'P1', EscalationNeeded: 'Yes', EscalationReason: 'Premium customer, high revenue impact, SLA breach imminent' },
        'CASE-002': { OneLiner: 'API rate limit inquiry from TechStart - scaling planning', BusinessImpact: 'LOW - Proactive question, no immediate issue, good engagement signal', Priority: 'P4', EscalationNeeded: 'No', EscalationReason: 'Standard inquiry, L1 can handle' },
        'CASE-003': { OneLiner: 'Billing error - $600 overcharge on Global Logistics invoice', BusinessImpact: 'MEDIUM - Premium customer, valid complaint, quick resolution needed', Priority: 'P3', EscalationNeeded: 'No', EscalationReason: 'Clear billing error, standard correction' }
      }
    };

    // ===================== STATE =====================
    let state = { template: TEMPLATES[0], recordIdx: 0, running: false, done: false, output: null, model: 'gpt-4o', format: 'structured' };

    // ===================== HELPERS =====================
    const getAccount = (id) => DMOs['Account__dlm'].records.find(r => r.AccountId === id);
    const getContact = (email) => DMOs['Contact__dlm'].records.find(r => r.Email === email);
    const tokens = (t) => Math.ceil(t.length / 4);
    const esc = (t) => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

    function resolve(template, rec) {
      let t = template;
      Object.entries(rec).forEach(([k, v]) => t = t.replace(new RegExp(`{{Case.${k}}}`, 'g'), v || ''));
      const acc = getAccount(rec.AccountId);
      if (acc) Object.entries(acc).forEach(([k, v]) => t = t.replace(new RegExp(`{{Account.${k}}}`, 'g'), v || ''));
      const con = getContact(rec.ContactEmail);
      if (con) Object.entries(con).forEach(([k, v]) => t = t.replace(new RegExp(`{{Contact.${k}}}`, 'g'), v || ''));
      return t;
    }

    function run() {
      state.running = true; state.done = false; state.output = null; render();
      setTimeout(() => {
        const rec = DMOs['Case__dlm'].records[state.recordIdx];
        state.output = MOCK_OUTPUTS[state.template.id]?.[rec.CaseId] || {};
        state.running = false; state.done = true; render();
      }, 1500 + Math.random() * 1000);
    }

    // ===================== RENDER =====================
    function render() {
      const cases = DMOs['Case__dlm'].records;
      const rec = cases[state.recordIdx];
      const prompt = resolve(state.template.prompt, rec);
      const inTok = tokens(prompt), outTok = state.output ? tokens(JSON.stringify(state.output)) : 500;

      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex flex-col">
          <!-- Header -->
          <header class="bg-white border-b px-4 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-gradient-to-br from-purple-600 to-blue-600 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
              </div>
              <span class="font-semibold text-gray-800">Content Foundry</span>
              <span class="text-xs text-gray-500 ml-1">Playground</span>
            </div>
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2 text-sm">
                <span class="text-gray-500">Model:</span>
                <select onchange="state.model=this.value" class="border rounded px-2 py-1 text-sm">
                  <option ${state.model==='gpt-4o'?'selected':''}>gpt-4o</option>
                  <option ${state.model==='gpt-4o-mini'?'selected':''}>gpt-4o-mini</option>
                  <option ${state.model==='claude-3-5-sonnet'?'selected':''}>claude-3-5-sonnet</option>
                </select>
              </div>
              <button class="bg-purple-600 text-white px-4 py-1.5 rounded font-medium hover:bg-purple-700">Save Pipeline</button>
            </div>
          </header>

          <!-- Main -->
          <div class="flex flex-1 overflow-hidden">
            <!-- Left: Data Sources -->
            <aside class="w-72 bg-white border-r flex flex-col">
              <div class="p-4 border-b">
                <h3 class="font-semibold text-gray-800 mb-3">📊 Data Sources</h3>
                <div class="mb-3">
                  <div class="text-xs text-gray-500 uppercase mb-1">Primary DMO</div>
                  <div class="border rounded-lg px-3 py-2 text-sm bg-gray-50">📋 Case</div>
                </div>
                <div>
                  <div class="text-xs text-gray-500 uppercase mb-1">Related DMOs</div>
                  <div class="space-y-1 text-sm">
                    <label class="flex items-center gap-2 p-1"><input type="checkbox" checked disabled class="rounded"> 🏢 Account</label>
                    <label class="flex items-center gap-2 p-1"><input type="checkbox" checked disabled class="rounded"> 👤 Contact</label>
                  </div>
                </div>
              </div>
              <div class="p-4 flex-1 overflow-auto">
                <div class="text-xs text-gray-500 uppercase mb-2">Test Record</div>
                ${cases.map((c, i) => `
                  <div onclick="state.recordIdx=${i};state.done=false;state.output=null;render()" class="p-2 rounded-lg border mb-2 cursor-pointer ${state.recordIdx===i ? 'bg-purple-50 border-purple-300' : 'hover:bg-gray-50'}">
                    <div class="text-sm font-medium text-gray-800 truncate">${c.Subject}</div>
                    <div class="text-xs text-gray-500">${c.CaseId}</div>
                  </div>
                `).join('')}
              </div>
              <div class="p-4 bg-gray-50 border-t text-sm">
                <div class="text-xs text-gray-500 uppercase mb-2">Token Estimate</div>
                <div class="flex justify-between"><span class="text-gray-600">Input</span><span class="font-medium">${inTok}</span></div>
                <div class="flex justify-between"><span class="text-gray-600">Output</span><span class="font-medium">~${outTok}</span></div>
                <div class="flex justify-between pt-2 border-t mt-2"><span class="text-gray-600">Est. Cost</span><span class="font-medium text-green-600">$${((inTok*0.00001)+(outTok*0.00003)).toFixed(4)}</span></div>
              </div>
            </aside>

            <!-- Center -->
            <main class="flex-1 flex flex-col overflow-hidden">
              <div class="bg-white border-b px-6 py-4 flex items-center justify-between">
                <div>
                  <select onchange="state.template=TEMPLATES.find(t=>t.id===this.value);state.done=false;state.output=null;render()" class="border rounded-lg px-3 py-2 text-sm min-w-64">
                    ${TEMPLATES.map(t => `<option value="${t.id}" ${state.template.id===t.id?'selected':''}>${t.name}</option>`).join('')}
                  </select>
                  <p class="text-sm text-gray-500 mt-1">${state.template.desc}</p>
                </div>
                <button onclick="run()" ${state.running?'disabled':''} class="flex items-center gap-2 px-4 py-2 bg-purple-600 text-white rounded-lg font-medium hover:bg-purple-700 disabled:opacity-50">
                  ${state.running ? '<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Running...' : '▶ Test Run'}
                </button>
              </div>
              <div class="flex-1 flex overflow-hidden">
                <div class="w-1/2 flex flex-col border-r">
                  <div class="px-4 py-2 bg-gray-50 border-b flex justify-between items-center">
                    <span class="font-semibold text-gray-800">📝 Resolved Prompt</span>
                    <span class="text-xs text-gray-500">${inTok} tokens</span>
                  </div>
                  <div class="flex-1 overflow-auto p-4 scrollbar-thin">
                    <pre class="text-sm whitespace-pre-wrap font-mono bg-gray-50 p-4 rounded-lg border">${esc(prompt)}</pre>
                  </div>
                </div>
                <div class="w-1/2 flex flex-col">
                  <div class="px-4 py-2 bg-gray-50 border-b flex justify-between items-center">
                    <span class="font-semibold text-gray-800">✨ Generated Output</span>
                    <div class="flex gap-1">
                      <button onclick="state.format='structured';render()" class="px-2 py-1 text-xs rounded ${state.format==='structured'?'bg-purple-100 text-purple-700':'text-gray-500'}">Structured</button>
                      <button onclick="state.format='raw';render()" class="px-2 py-1 text-xs rounded ${state.format==='raw'?'bg-purple-100 text-purple-700':'text-gray-500'}">JSON</button>
                    </div>
                  </div>
                  <div class="flex-1 overflow-auto p-4 scrollbar-thin">${renderOutput()}</div>
                </div>
              </div>
            </main>

            <!-- Right: Output Mapping -->
            <aside class="w-72 bg-white border-l flex flex-col">
              <div class="p-4 border-b">
                <h3 class="font-semibold text-gray-800">📤 Output Mapping</h3>
                <p class="text-xs text-gray-500">Map fields to target DMO</p>
              </div>
              <div class="flex-1 overflow-auto p-4">
                <div class="mb-4">
                  <div class="text-xs text-gray-500 uppercase mb-1">Target DMO</div>
                  <select class="w-full border rounded-lg px-3 py-2 text-sm">
                    <option>📋 Case (Update)</option>
                    <option>📊 Case_Enrichment__dlm (New)</option>
                  </select>
                </div>
                <div class="text-xs text-gray-500 uppercase mb-2">Field Mappings</div>
                ${state.template.fields.map(f => `
                  <div class="p-3 bg-gray-50 rounded-lg border mb-2">
                    <div class="flex justify-between mb-1">
                      <span class="text-sm font-medium">${f}</span>
                      <span class="text-xs px-2 py-0.5 rounded-full ${state.done?'bg-green-100 text-green-700':'bg-gray-200 text-gray-500'}">${state.done?'✓ Mapped':'Pending'}</span>
                    </div>
                    <select class="w-full border rounded px-2 py-1 text-xs"><option>→ Case.${f}__c</option></select>
                  </div>
                `).join('')}
              </div>
              ${state.done ? `<div class="p-4 bg-green-50 border-t">
                <div class="flex items-center gap-2 text-green-700 font-medium mb-1">✓ Test Run Complete</div>
                <div class="text-xs text-green-600">Fields extracted: ${state.template.fields.length}</div>
              </div>` : ''}
            </aside>
          </div>
        </div>`;
    }

    function renderOutput() {
      if (state.running) return `<div class="flex flex-col items-center justify-center h-full text-gray-400"><svg class="w-10 h-10 animate-spin mb-2 text-purple-500" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>Generating...</div>`;
      if (!state.done) return `<div class="flex flex-col items-center justify-center h-full text-gray-400"><div class="text-4xl mb-2">▶</div>Click "Test Run"</div>`;
      if (state.format === 'raw') return `<pre class="text-sm font-mono bg-gray-900 text-green-400 p-4 rounded-lg whitespace-pre-wrap">${JSON.stringify(state.output, null, 2)}</pre>`;
      return `<div class="space-y-3">${Object.entries(state.output).map(([k, v]) => `
        <div class="p-3 bg-white rounded-lg border">
          <div class="text-xs text-gray-500 uppercase mb-1">${k}</div>
          <div class="text-sm ${k==='Sentiment'&&v==='Angry'?'text-red-600 font-medium':''} ${k==='UrgencyScore'&&v>=8?'text-red-600 font-bold':''} ${k==='Priority'&&v==='P1'?'text-red-600 font-bold':''}">
            ${Array.isArray(v) ? `<ul class="list-disc list-inside">${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : esc(String(v))}
          </div>
        </div>`).join('')}</div>`;
    }

    render();
  </script>
</body>
</html>
